  <script>
    // Slideshow automatico: pesca da TUTTO l'archivio (photos.js),
    // in ordine casuale diverso a ogni caricamento della pagina.
    const tutte = [...new Set(ARCHIVIO.flatMap(c => c.foto))];

    // mescola (Fisher-Yates)
    for (let i = tutte.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tutte[i], tutte[j]] = [tutte[j], tutte[i]];
    }

    const img = document.getElementById('slideshow');
    let indice = 0;
    img.src = tutte[0];

    // precarica la prossima per evitare "flash" bianchi
    function precarica(n) {
      const p = new Image();
      p.src = tutte[n % tutte.length];
    }
    precarica(1);

    setInterval(() => {
      indice = (indice + 1) % tutte.length;
      // la nuova foto viene mostrata solo quando è completamente
      // pronta: mai immagini che compaiono a metà
      const nuova = new Image();
      nuova.src = tutte[indice];
      nuova.decode()
        .then(() => { img.src = nuova.src; })
        .catch(() => { img.src = nuova.src; });
      precarica(indice + 1);
    }, 8000); // cambia foto ogni 8 secondi
  </script>
</body>
