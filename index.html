<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blabla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="foto.html">foto</a>
      <a href="video.html">video</a>
      <a href="other.html">other</a>
    </nav>
  </header>

  <main>
    <div class="home-slideshow" id="ss-wrap">
      <img id="slideshow" src="" alt="">
      <button class="ss-open" id="ss-full">[fullscreen]</button>
      <div class="ss-controls">
        <button id="ss-pause">[PAUSE]</button>
        <button id="ss-exit">[x]</button>
      </div>
    </div>
  </main>

  <footer>
    <p><a href="about.html">About / Contacts</a></p>
  </footer>

  <script src="photos.js"></script>
  <script>
    // ================= SLIDESHOW =================
    // Pesca da TUTTO l'archivio (photos.js), in ordine
    // casuale diverso a ogni caricamento della pagina.
    const tutte = [...new Set(ARCHIVIO.flatMap(c => c.foto))];

    // mescola (Fisher-Yates)
    for (let i = tutte.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tutte[i], tutte[j]] = [tutte[j], tutte[i]];
    }

    const img = document.getElementById('slideshow');
    const wrap = document.getElementById('ss-wrap');
    const btnFull = document.getElementById('ss-full');
    const btnPause = document.getElementById('ss-pause');
    const btnExit = document.getElementById('ss-exit');

    const INTERVALLO = 10000; // millisecondi tra una foto e l'altra

    let indice = 0;
    let timer = null;
    let inPausa = false;

    function precarica(n) {
      const p = new Image();
      p.src = tutte[n % tutte.length];
    }

    // mostra la foto n solo quando è completamente pronta:
    // mai immagini che compaiono a metà
    function mostra(n) {
      indice = (n + tutte.length) % tutte.length;
      const nuova = new Image();
      nuova.src = tutte[indice];
      nuova.decode()
        .then(() => { img.src = nuova.src; })
        .catch(() => { img.src = nuova.src; });
      precarica(indice + 1);
    }

    // ---- timer: avvio / pausa ----
    // Il bottone mostra sempre l'AZIONE del prossimo click,
    // come il bottone audio di vgproject:
    // [PAUSE] visibile = slideshow in corso, [PLAY] = fermo
    function avvia() {
      clearInterval(timer);
      timer = setInterval(() => mostra(indice + 1), INTERVALLO);
      inPausa = false;
      btnPause.textContent = '[PAUSE]';
    }
    function pausa() {
      clearInterval(timer);
      timer = null;
      inPausa = true;
      btnPause.textContent = '[PLAY]';
    }
    function togglePausa() {
      if (inPausa) { avvia(); } else { pausa(); }
    }

    // ---- schermo intero ----
    function entraFullscreen() {
      if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    }
    function esciFullscreen() {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    function fullscreenAttivo() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    btnFull.addEventListener('click', entraFullscreen);
    btnExit.addEventListener('click', esciFullscreen);
    btnPause.addEventListener('click', togglePausa);

    // se il browser non supporta lo schermo intero, il bottone sparisce
    if (!wrap.requestFullscreen && !wrap.webkitRequestFullscreen) {
      btnFull.style.display = 'none';
    }

    function suCambioFullscreen() {
      wrap.classList.toggle('is-fullscreen', !!fullscreenAttivo());
      if (!fullscreenAttivo()) avvia(); // uscendo, il timer riparte sempre
    }
    document.addEventListener('fullscreenchange', suCambioFullscreen);
    document.addEventListener('webkitfullscreenchange', suCambioFullscreen);

    // Tastiera, solo a schermo intero:
    // SPAZIO = pausa/riprendi — FRECCE = foto avanti/indietro
    document.addEventListener('keydown', (e) => {
      if (!fullscreenAttivo()) return;
      if (e.key === ' ') { e.preventDefault(); togglePausa(); }
      if (e.key === 'ArrowRight') { mostra(indice + 1); if (!inPausa) avvia(); }
      if (e.key === 'ArrowLeft')  { mostra(indice - 1); if (!inPausa) avvia(); }
    });

    // ---- via ----
    img.src = tutte[0];
    precarica(1);
    avvia();
  </script>
</body>
</html>
